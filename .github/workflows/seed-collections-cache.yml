name: Seed collections cache

# Workaround while Galaxy is down: fills the cache that ci.yml restores (same key) from the collections' GitHub
# repositories. Run it manually on the default branch, and again after requirements.yml changed. Remove it once
# Galaxy is reliable again.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache the Galaxy collections
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ansible-role-collections
          key: collections-${{ hashFiles('requirements.yml') }}

      - name: Install the collections from GitHub
        if: steps.cache.outputs.cache-hit != 'true'
        run: make seed-collections
