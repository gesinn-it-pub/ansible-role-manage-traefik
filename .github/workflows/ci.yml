name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.adoc'
  pull_request:
    paths-ignore:
      - '**/*.adoc'
  schedule:
    - cron: '17 4 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache the Galaxy collections
        # Valid until requirements.yml changes. Accessed by the scheduled runs, so GitHub does not evict it
        # (unused caches are deleted after 7 days)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ansible-role-collections
          key: collections-${{ hashFiles('requirements.yml') }}

      - name: Run lint
        run: make lint

  molecule:
    name: molecule (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # floor: the ansible-core line the consuming projects run
          - name: ansible-core 2.19
            ansible_core: '2.19'
          # latest: the ansible-core bundled in the pinned tool image
          - name: ansible-core latest
            ansible_core: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache the Galaxy collections
        # Valid until requirements.yml changes. Accessed by the scheduled runs, so GitHub does not evict it
        # (unused caches are deleted after 7 days)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ansible-role-collections
          key: collections-${{ hashFiles('requirements.yml') }}

      - name: Run molecule
        run: make molecule ANSIBLE_CORE=${{ matrix.ansible_core }}
