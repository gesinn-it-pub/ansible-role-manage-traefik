name: Molecule

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:

  molecule:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        traefik_version: ["2.11", "3.3"]
        scenario: ["without-ofelia", "with-ofelia"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run molecule (${{ matrix.scenario }}, traefik ${{ matrix.traefik_version }})
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e TRAEFIK_VERSION=${{ matrix.traefik_version }} \
            ghcr.io/ansible/community-ansible-dev-tools:26.4.0 \
            bash -c "mkdir -p /tmp/roles \
                     && ln -s /workspace /tmp/roles/ansible-role-manage-traefik \
                     && ansible-galaxy collection install -r requirements.yml \
                     && ANSIBLE_ROLES_PATH=/tmp/roles molecule test -s ${{ matrix.scenario }}"
